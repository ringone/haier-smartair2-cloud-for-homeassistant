name: Local telemetry tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_requirements.py
      - run: python tests/check_marketplace.py
      - run: python -m pip install ruff==0.17.5
      - run: ruff check --select F custom_components tests

  home-assistant-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PyPI JSON checked 2026-11-14; 2026.11.1 uploaded 2026-11-09.
        homeassistant: ["2026.11.0", "2026.11.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install "homeassistant==${{ matrix.homeassistant }}"
      - run: python tests/ha_localonly_smoke.py
      - run: python tests/ha_climate_compat.py
      - run: python tests/ha_marketplace_smoke.py
