name: Local telemetry tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_requirements.py
      - run: python -m pip install ruff==0.17.5
      - run: ruff check --select F custom_components tests

  home-assistant-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install homeassistant==2026.11.0
      - run: python tests/ha_localonly_smoke.py
