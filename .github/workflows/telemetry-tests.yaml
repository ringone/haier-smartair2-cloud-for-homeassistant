name: Local telemetry tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests -v
